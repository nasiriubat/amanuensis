                  - heading "Introduction" [level=2] [ref=f18e198]
                  - paragraph [ref=f18e199]: Public procurement in Finland presents a significant challenge for small and medium-sized enterprises (SMEs). SME bid managers are responsible for identifying relevant tenders from a large and growing volume of notices published daily on platforms such as Hilma (the Finnish procurement portal) and TED (Tenders Electronic Daily, the EU-wide procurement feed). The process is time-consuming and error-prone, particularly for companies with limited resources and expertise in procurement procedures.
                  - paragraph [ref=f18e200]: A typical scenario involves an SME owner or bid manager logging into Hilma and TED, applying broad filters such as CPV code and region, and then manually skimming through titles and the first paragraphs of each notice. This manual review is necessary because the filters often miss relevant tenders that are filed under neighboring or unexpected codes. The most labor-intensive and frustrating step is reading and discarding irrelevant notices, which can consume several hours each week. This approach risks missing valuable opportunities, especially when a relevant tender is overlooked due to information overload or ambiguous categorization.
                  - paragraph [ref=f18e201]: Manual practices are inefficient and unreliable. Bid managers must balance thoroughness against the time available, leading to a trade-off between speed and coverage. The risk of missing a relevant tender is high, and a single missed opportunity can have a disproportionate impact on trust in any support tool or workflow. Current methods do not adapt to the specific capabilities or interests of each SME, and there is little automation to assist in prioritizing or ranking notices.
                  - paragraph [ref=f18e202]: In this context, public procurement refers to the process by which government bodies invite companies to bid for contracts to supply goods, services, or works. SMEs are the primary users of Tender Scout, defined here as companies with up to 50 employees. Hilma is the Finnish national procurement portal, while TED is the European Union’s centralized procurement feed. Tender Scout uses a large language model (LLM) to rank tenders in both feeds against a company’s profile, aiming to surface the most relevant opportunities.
                  - paragraph [ref=f18e203]: "There is a clear gap in the Finnish market: no existing tool automatically matches and ranks public procurement notices for SMEs based on their specific profiles and capabilities. Current solutions rely on manual filtering and review, which does not scale and often fails to meet the needs of smaller companies."
                  - paragraph [ref=f18e204]: "This paper addresses the research question: Can Tender Scout improve the identification of relevant tenders for SMEs compared to current manual practices?"
                  - paragraph [ref=f18e205]:
                    - text: "The contributions of this paper are as follows:"
                    - mark [ref=f18e206]: "NEEDS: explicit statement of contributions as a list"
                  - paragraph [ref=f18e207]: The remainder of the paper is structured as follows. Section 3 introduces a running example that illustrates the challenges faced by SME bid managers. Section 4 describes the architecture and core workflow of Tender Scout. Section 5 details each component and the end-to-end process. Section 6 discusses extensibility and deployment. Section 7 presents evaluation scenarios and demonstration results. Section 8 reflects on limitations. Section 9 reviews related work. Sections 10 and 11 conclude and provide artefact availability.
