[project]
name = "paper-writer"
version = "0.1.0"
description = "An AI co-author that learns how good papers are written and helps you write yours."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.34",
    "python-slugify>=8.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pypdfium2>=4.30",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
extract = [
    "docling>=2.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["B008"]  # Depends() in defaults is the FastAPI idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
