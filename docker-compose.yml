services:
  coscribe:
    build: .
    image: coscribe:local
    container_name: coscribe
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - coscribe_data:/data
    # Ollama on the host is reachable as http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  coscribe_data:
